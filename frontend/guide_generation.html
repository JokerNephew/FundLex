<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="fundlex-base-path" content="" />
    <title>正在打开修改指引生成 · FundLex</title>
  </head>
  <body>
    <main class="redirect-page" style="font-family: system-ui, sans-serif; padding: 48px; max-width: 720px; margin: 0 auto">
      <h1>修改指引生成已合并到工作台</h1>
      <p>正在打开「工作台 → 指引生成」。如果页面没有自动跳转，请使用下面的链接。</p>
      <p><a id="gg-redirect" href="/#generation">打开指引生成</a></p>
    </main>
    <script>
      (() => {
        const base = ([...document.querySelectorAll('meta[name="fundlex-base-path"]')].map((node) => (node.content || '').trim()).filter(Boolean).pop() || '').replace(/\/+$/, '');
        const params = new URLSearchParams(location.search);
        const id = params.get('run') || params.get('id');
        const query = new URLSearchParams();
        if (id) { query.set('mode', 'detail'); query.set('id', id); }
        const hash = `#generation${query.toString() ? `?${query}` : ''}`;
        const target = `${base || ''}/${hash}`;
        const link = document.getElementById('gg-redirect');
        link.href = target;
        location.replace(target);
      })();
    </script>
  </body>
</html>

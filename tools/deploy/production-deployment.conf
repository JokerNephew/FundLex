# Non-secret production deployment contract.
# Credentials remain in /etc/fundlex-recall.env.
# The publisher requires an explicit reviewed --source; no implicit tree is
# configured here.
FUNDLEX_DEPLOY_SOURCE=
FUNDLEX_DEPLOY_DIR=/opt/fundlex-recall-first
FUNDLEX_ENV_FILE=/etc/fundlex-recall.env
FUNDLEX_DATA_DIR=/var/lib/fundlex
FUNDLEX_API_BIND=127.0.0.1
FUNDLEX_API_PORT=8010
FUNDLEX_SERVICES="fundlex-recall-api.service fundlex-recall-worker.service fundlex-compare-worker.service fundlex-guide-worker.service fundlex-feishu.service"
FUNDLEX_READ_WRITE_PATHS="/var/lib/fundlex"
FUNDLEX_ADDRESS_FAMILIES="AF_UNIX AF_INET AF_INET6"

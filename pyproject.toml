[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "fundlex"
version = "0.1.0"
description = "DOCX-only fund contract rule evaluation and local workbench"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143,<1",
    "uvicorn>=0.54,<1",
    "python-multipart>=0.0.32,<1",
    "python-docx>=1.2,<2",
    "lxml>=6.1,<7",
    "PyYAML>=6,<7",
    "jsonschema>=4.26,<5",
    "httpx>=0.28,<1",
    "pymysql>=1.1",
]

[project.optional-dependencies]
test = ["pytest>=9,<10"]

[tool.setuptools.packages.find]
include = ["fundlex*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
